# Lint, regression and the perf study on every push. Not run locally (the repo
# is local only so far). Verilator is built from the v5.050 tag, the version
# used for every number in the README.
name: ci

on: [push, pull_request, workflow_dispatch]

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git help2man perl python3 make autoconf g++ flex bison \
            ccache libfl2 libfl-dev zlib1g-dev

      - name: Cache Verilator
        id: vcache
        uses: actions/cache@v4
        with:
          path: ~/verilator
          key: verilator-v5.050-${{ runner.os }}

      - name: Build Verilator v5.050
        if: steps.vcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b v5.050 https://github.com/verilator/verilator /tmp/vsrc
          cd /tmp/vsrc && autoconf && ./configure --prefix=$HOME/verilator && make -j$(nproc) && make install

      - name: Lint
        run: PATH=$HOME/verilator/bin:$PATH make lint

      - name: Regression
        run: PATH=$HOME/verilator/bin:$PATH make regress

      - name: Perf study
        run: PATH=$HOME/verilator/bin:$PATH make perf

      - name: Publish summary
        if: always()
        run: cat results/regress/summary.md results/perf/summary.md >> $GITHUB_STEP_SUMMARY || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: results/
